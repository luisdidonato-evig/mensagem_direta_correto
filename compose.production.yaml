services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evig_messages
      POSTGRES_USER: evig
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evig -d evig_messages"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 192M

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ${EVIG_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://evig:${POSTGRES_PASSWORD}@postgres:5432/evig_messages
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      AUTO_CREATE_SCHEMA: "false"
      DISPATCH_MODE: celery
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --concurrency=1
    env_file: ${EVIG_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://evig:${POSTGRES_PASSWORD}@postgres:5432/evig_messages
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      AUTO_CREATE_SCHEMA: "false"
      DISPATCH_MODE: celery
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO
    env_file: ${EVIG_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://evig:${POSTGRES_PASSWORD}@postgres:5432/evig_messages
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      AUTO_CREATE_SCHEMA: "false"
      DISPATCH_MODE: celery
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 192M

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
        VITE_AUTH_ENABLED: "true"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?configure PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
